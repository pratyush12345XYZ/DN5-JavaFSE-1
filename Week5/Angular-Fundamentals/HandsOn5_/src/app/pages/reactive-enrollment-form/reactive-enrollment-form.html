<div class="form-container">
  <h2>Reactive Enrollment Form</h2>
  
  <form [formGroup]="enrollForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="studentName">Student Name:</label>
      <input type="text" id="studentName" formControlName="studentName" class="form-control"
             [class.is-invalid]="enrollForm.get('studentName')?.invalid && enrollForm.get('studentName')?.touched"
             [class.is-valid]="enrollForm.get('studentName')?.valid && enrollForm.get('studentName')?.touched">
      <div *ngIf="enrollForm.get('studentName')?.invalid && enrollForm.get('studentName')?.touched" class="error-message">
        <span *ngIf="enrollForm.get('studentName')?.errors?.['required']">Student Name is required.</span>
        <span *ngIf="enrollForm.get('studentName')?.errors?.['minlength']">Minimum length is 3 characters.</span>
      </div>
    </div>

    <div class="form-group">
      <label for="studentEmail">Student Email:</label>
      <input type="email" id="studentEmail" formControlName="studentEmail" class="form-control"
             [class.is-invalid]="enrollForm.get('studentEmail')?.invalid && enrollForm.get('studentEmail')?.touched"
             [class.is-valid]="enrollForm.get('studentEmail')?.valid && enrollForm.get('studentEmail')?.touched">
      <div *ngIf="enrollForm.get('studentEmail')?.invalid && enrollForm.get('studentEmail')?.touched" class="error-message">
        <span *ngIf="enrollForm.get('studentEmail')?.errors?.['required']">Email is required.</span>
        <span *ngIf="enrollForm.get('studentEmail')?.errors?.['email']">Invalid email format.</span>
        <span *ngIf="enrollForm.get('studentEmail')?.errors?.['emailTaken']">Email taken</span>
      </div>
    </div>

    <div class="form-group">
      <label for="courseId">Course ID:</label>
      <!-- Changed to text so we can test the 'XX' prefix condition -->
      <input type="text" id="courseId" formControlName="courseId" class="form-control"
             [class.is-invalid]="enrollForm.get('courseId')?.invalid && enrollForm.get('courseId')?.touched"
             [class.is-valid]="enrollForm.get('courseId')?.valid && enrollForm.get('courseId')?.touched">
      <div *ngIf="enrollForm.get('courseId')?.invalid && enrollForm.get('courseId')?.touched" class="error-message">
        <span *ngIf="enrollForm.get('courseId')?.errors?.['required']">Course ID is required.</span>
        <span *ngIf="enrollForm.get('courseId')?.errors?.['noCourseCode']">Course code starting with XX is not allowed.</span>
      </div>
    </div>

    <div class="form-group">
      <label for="preferredSemester">Preferred Semester:</label>
      <select id="preferredSemester" formControlName="preferredSemester" class="form-control"
              [class.is-invalid]="enrollForm.get('preferredSemester')?.invalid && enrollForm.get('preferredSemester')?.touched"
              [class.is-valid]="enrollForm.get('preferredSemester')?.valid && enrollForm.get('preferredSemester')?.touched">
        <option value="Odd">Odd</option>
        <option value="Even">Even</option>
      </select>
      <div *ngIf="enrollForm.get('preferredSemester')?.invalid && enrollForm.get('preferredSemester')?.touched" class="error-message">
        <span *ngIf="enrollForm.get('preferredSemester')?.errors?.['required']">Preferred Semester is required.</span>
      </div>
    </div>

    <div formArrayName="additionalCourses" class="form-group">
      <label>Additional Courses:</label>
      <div *ngFor="let control of additionalCourses.controls; let i = index" class="array-item">
        <input type="text" [formControlName]="i" class="form-control"
               [class.is-invalid]="control.invalid && control.touched"
               [class.is-valid]="control.valid && control.touched"
               placeholder="Additional Course {{ i + 1 }}">
        <button type="button" class="btn-remove" (click)="removeCourse(i)">Remove</button>
        <div *ngIf="control.invalid && control.touched" class="error-message">
          <span *ngIf="control.errors?.['required']">Additional course is required.</span>
        </div>
      </div>
      <button type="button" class="btn-add" (click)="addCourse()">Add Another Course</button>
    </div>

    <div class="form-group checkbox-group">
      <label>
        <input type="checkbox" formControlName="agreeToTerms">
        I agree to the terms and conditions
      </label>
      <div *ngIf="enrollForm.get('agreeToTerms')?.invalid && enrollForm.get('agreeToTerms')?.touched" class="error-message">
        <span *ngIf="enrollForm.get('agreeToTerms')?.errors?.['required']">You must agree to the terms.</span>
      </div>
    </div>

    <button type="submit" [disabled]="enrollForm.invalid" class="submit-btn">Submit</button>
  </form>
</div>
