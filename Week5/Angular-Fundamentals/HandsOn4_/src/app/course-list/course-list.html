<h2>Available Courses</h2>

<p *ngIf="isLoading">
    Loading courses...
</p>

<div
    class="course-container"
    *ngIf="!isLoading">

    <app-course-card
        *ngFor="let c of courses; let i = index; trackBy: trackByCourseId"
        appHighlight="lightblue"
        [course]="c"
        (enrollRequested)="onEnroll($event)">
    </app-course-card>

</div>

<p *ngIf="selectedCourseId">
    <strong>Selected Course ID:</strong>
    {{ selectedCourseId }}
</p>
