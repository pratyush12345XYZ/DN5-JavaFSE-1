<div class="enrollment-container">
    <h2>Student Course Enrollment Request</h2>

    <div *ngIf="submitted" class="success-message">
        Enrollment request submitted successfully!
    </div>
    
    <form #enrollForm="ngForm" (ngSubmit)="onSubmit(enrollForm)">
        <div class="form-group">
            <label for="studentName">Student Name:</label>
            <input 
                type="text" 
                id="studentName" 
                name="studentName" 
                [(ngModel)]="studentName"
                #nameCtrl="ngModel"
                required
                minlength="3">
            <div *ngIf="nameCtrl.touched && nameCtrl.errors?.['required']" class="error-message">
                Name is required
            </div>
            <div *ngIf="nameCtrl.touched && nameCtrl.errors?.['minlength']" class="error-message">
                Name must be at least 3 characters
            </div>
        </div>

        <div class="form-group">
            <label for="studentEmail">Student Email:</label>
            <input 
                type="email" 
                id="studentEmail" 
                name="studentEmail" 
                [(ngModel)]="studentEmail"
                #emailCtrl="ngModel"
                required
                email>
            <div *ngIf="emailCtrl.touched && emailCtrl.errors?.['required']" class="error-message">
                Email is required
            </div>
            <div *ngIf="emailCtrl.touched && emailCtrl.errors?.['email']" class="error-message">
                Enter a valid email address
            </div>
        </div>

        <div class="form-group">
            <label for="courseId">Course ID:</label>
            <input 
                type="number" 
                id="courseId" 
                name="courseId" 
                [(ngModel)]="courseId"
                #courseIdCtrl="ngModel"
                required>
            <div *ngIf="courseIdCtrl.touched && courseIdCtrl.errors?.['required']" class="error-message">
                Course ID is required
            </div>
        </div>

        <div class="form-group">
            <label for="preferredSemester">Preferred Semester:</label>
            <select 
                id="preferredSemester" 
                name="preferredSemester" 
                [(ngModel)]="preferredSemester">
                <option value="" disabled selected>Select Semester</option>
                <option value="Odd">Odd</option>
                <option value="Even">Even</option>
            </select>
        </div>

        <div class="form-group checkbox-group">
            <input 
                type="checkbox" 
                id="agreeToTerms" 
                name="agreeToTerms" 
                [(ngModel)]="agreeToTerms"
                #termsCtrl="ngModel"
                required>
            <label for="agreeToTerms">I agree to the terms and conditions</label>
        </div>
        <div *ngIf="termsCtrl.touched && termsCtrl.errors?.['required']" class="error-message">
            You must accept the terms
        </div>

        <div class="form-actions">
            <button type="submit" [disabled]="enrollForm.invalid">Submit</button>
            <button type="button" (click)="enrollForm.resetForm(); submitted = false">Reset</button>
        </div>
    </form>
</div>
